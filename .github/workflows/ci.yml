name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --package-lock-only && npm ci
      - name: Dependency audit summary
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const a=require('/tmp/npm-audit.json'); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name + ': ' + v.severity + '; range=' + v.range + '; fix=' + JSON.stringify(v.fixAvailable))"
      - name: Enforce dependency security
        run: npm audit --audit-level=low
      - name: TypeScript validation
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit dependency lockfile when changed
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: refresh npm dependency lockfile"
            git push origin HEAD:main
          fi
